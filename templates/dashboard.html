<html>
<head>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">

<h1>📊 Your History</h1>

{% for row in data %}
<div class="result">
<p><strong>{{row[0]}}</strong></p>
<p>{{row[1]}}%</p>

<p>
{% if row[2] %}
🚨 Scam
{% else %}
✅ Safe
{% endif %}
</p>

<p style="font-size:12px; opacity:0.6;">
{{row[3]}}
</p>
</div>
{% endfor %}

<p><a href="/">⬅ Back</a></p>

</div>
</body>
</html>
